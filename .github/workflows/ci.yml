name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group lint
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Import-layer contracts
        run: uv run lint-imports
      - name: Calendar table is in sync with data/calendar.csv
        run: uv run python tools/build_table.py --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group typing
      - name: mypy (strict)
        run: uv run mypy
      - name: pyright (strict)
        run: uv run pyright
      - name: Public type completeness
        run: uv run pyright --verifytypes sambat --ignoreexternal

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: actionlint
        run: uvx --from actionlint-py actionlint
      - name: zizmor
        run: uvx zizmor --offline --format=github .github/workflows

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build
      - name: Check metadata and wheel contents
        run: |
          uvx twine check --strict dist/*
          uvx check-wheel-contents dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.python }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "pypy3.11"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.14"
            coverage: true
    env:
      HYPOTHESIS_PROFILE: ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install the built wheel and the test dependencies
        run: |
          uv venv
          uv pip install dist/*.whl --group test
      - name: Run the tests against the installed wheel
        if: ${{ !matrix.coverage }}
        run: uv run --no-sync pytest
      - name: Run the tests with coverage
        if: ${{ matrix.coverage }}
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group docs
      - name: Run the examples in docstrings, the README and the docs
        run: |
          uv run pytest --doctest-modules src/sambat --doctest-glob=README.md README.md
          uv run pytest docs
      - name: Build the site (warnings are errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group bench
      - run: uv run pytest benchmarks --benchmark-only --benchmark-columns=min,median,ops --benchmark-sort=name
      - name: Import time
        run: uv run python -X importtime -c "import sambat" 2>&1 | tail -n 15

  changelog:
    name: News fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a changelog.d/ fragment unless labelled skip-changelog
        env:
          BASE_REF: ${{ github.base_ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') || github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Changelog check skipped."
            exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- changelog.d/ | grep -v 'README.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::Add a news fragment to changelog.d/ (see CONTRIBUTING.md) or label the PR skip-changelog."
            exit 1
          fi
          echo "Found: $added"

  ci-pass:
    name: CI pass
    if: always()
    needs: [lint, typecheck, workflows, build, test, docs, benchmarks, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed (skipped jobs are allowed)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              exit 1
            fi
          done
